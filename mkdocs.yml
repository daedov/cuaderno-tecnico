site_name: Cuaderno Técnico
site_description: Notas sobre DevOps, DevSecOps y Cloud
site_author: Dani
site_url: https://daedov.github.io/cuaderno-tecnico/

repo_url: https://github.com/daedov/cuaderno-tecnico
repo_name: daedov/cuaderno-tecnico
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copiar-comandos.js

plugins:
  - search:
      lang: es
  - awesome-pages
  - tags
  # Notas movidas: las URLs antiguas siguen funcionando
  - redirects:
      redirect_maps:
        devops/operacion/observabilidad.md: monitoreo/fundamentos/observabilidad.md
        devops/operacion/leer-logs.md: monitoreo/logging/leer-logs.md
        cloud/operacion-y-gobierno/observabilidad-nativa.md: monitoreo/nube/observabilidad-nativa.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >
  Contenido en dominio público
  (<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.es">CC0 1.0</a>)

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daedov
      name: GitHub
  generator: false
